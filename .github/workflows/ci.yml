name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    uses: Juliusolsson05/agent-code/.github/workflows/reusable-package-ci.yml@1bcba63719b71da389a83243feba4fbe22461e2b
    with:
      # WHY 22.12.0 is the floor: this package runs inside Agent Code's main
      # process, whose declared development floor is Node 22.12 (Electron
      # itself embeds 24). Pi's own Node floor (22.19) applies to the `pi`
      # process, never to this package. Pinning the literal floor catches code
      # that only works on the Node 24 development default.
      node-versions: '["22.12.0", "24"]'
